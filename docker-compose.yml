version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: medical_booking_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: medical_booking_server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/medical-booking
      - JWT_SECRET=supersecretjwtkeythatshouldbechangedinprod
      - CLIENT_URL=http://localhost:5173
      - EMAIL_USER=test@example.com
      - EMAIL_PASS=testpass
    depends_on:
      - mongodb
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: medical_booking_client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongodb_data:
